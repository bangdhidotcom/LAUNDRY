name: laundry3b1titik0
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  http: ^1.2.1
  dio: ^5.4.3+1
  shared_preferences: ^2.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.5.0
  image_picker: ^1.1.2 
  path: ^1.9.1
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  marquee: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/logo_3b.png

# --- 1. KONFIGURASI LOGO APLIKASI (MENU HP) ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_b2.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff" # Background putih biar rapi
  adaptive_icon_foreground: "assets/images/logo_b2.png"
  remove_alpha_ios: true

# --- 2. KONFIGURASI NATIVE SPLASH SCREEN (LOADING AWAL) ---
flutter_native_splash:
  color: "#ffffff" # Background putih (ganti #000000 kalau mau hitam)
  image: "assets/images/logo_b2.png" # Logo di tengah layar
  branding: "assets/images/logo_b2.png" # (Opsional) Branding tambahan bawah
  
  # Khusus Android 12+ (Penting biar logo gak kecil banget)
  android_12:
    image: "assets/images/logo_b2.png"
    icon_background_color: "#ffffff"
  
  ios: true
  android: true